name: Build Android APK
# Build verification trigger
# Social features build verification
# Rebuild after pull-to-refresh opt-in fix
# Rebuild after compile fix

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf "SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n" "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > local.properties
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: camillian-community-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
